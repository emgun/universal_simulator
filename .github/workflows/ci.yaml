name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c .github/ci-constraints.txt -e .[dev]
      - name: Lint (ruff/black)
        run: |
          ruff --version
          ruff check .
          black --check --line-length 100 --target-version py310 .
      - name: Check YAML duplicate keys
        run: |
          python scripts/check_yaml_duplicates.py configs docs
      - name: Unit tests
        run: |
          pytest -q tests/unit
      - name: Integration tests
        run: |
          pytest -q tests/integration
      - name: Check deterministic structured public assets
        run: |
          python scripts/build_public_assets.py --check --check-structured-only
