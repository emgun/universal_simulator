seed: 17
precision: bf16
latent:
  dim: 32
  tokens: 64
decoder:
  hidden_dim: 128
  num_layers: 2
  num_heads: 4
  mlp_hidden_dim: 128
data:
  kind: grid
  path: data/poc_trio.zarr
  group: diffusion2d
  patch_size: 4
training:
  batch_size: 8
  dt: 0.1
  patience: 1
  auto_conditioning: false
  preserve_sequences: false
  lambda_semigroup: 0.0
  log_path: reports/training_log.jsonl
logging:
  backend: stdout
  level: INFO
  wandb:
    enabled: true
    project: universal-simulator
    run_name: default
evaluation:
  promotion:
    rules: []
stages:
  decoder:
    epochs: 0
  operator_decoded:
    epochs: 0
    rollout_steps: 2
    lambda_rollout: 1.0
  joint_codec_operator:
    epochs: 0
    rollout_steps: 2
    lambda_rollout: 1.0
    lambda_reconstruction: 0.25
