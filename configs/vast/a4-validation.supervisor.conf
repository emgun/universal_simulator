[program:a4-validation]
command=/workspace/universal_simulator/scripts/run_a4_vast_validation.sh
directory=/workspace/universal_simulator
autostart=false
autorestart=false
startsecs=0
stdout_logfile=/workspace/universal_simulator/reports/a4_strat_v1_validation.log
stderr_logfile=/workspace/universal_simulator/reports/a4_strat_v1_validation.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"
