[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-physics-stack"
version = "0.0.1"
description = "Universal Physics Stack - unified latent simulator with a transformer core, any-point decoding, and physics guards"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Universal Physics Stack Devs"}]
license = {text = "Apache-2.0"}
keywords = ["physics simulation", "neural operators", "pde", "machine learning", "scientific computing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "torch>=2.3",
  "einops>=0.7",
  "xarray>=2023.1",
  "zarr>=2.16",
  "h5py>=3.9",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "mlflow>=2.13",
  "wandb>=0.17",
  "trimesh>=4.0",
  "pykeops>=2.2",
  "pyvista>=0.43",
  "pyarrow>=14.0",
  "netCDF4>=1.6",
  "sympy>=1.12",
  "pysr>=0.18",
  "pysindy>=1.8",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "seaborn>=0.13",
]

[project.urls]
Homepage = "https://github.com/emgun/universal_simulator"
Repository = "https://github.com/emgun/universal_simulator"
Issues = "https://github.com/emgun/universal_simulator/issues"

[project.scripts]
ups-data = "ups.data.cli:main"

[project.optional-dependencies]
well = [
  "the_well==1.2.0",
]
dev = [
  "pytest>=7.4",
  "pytest-xdist>=3.3",
  "ruff>=0.5",
  "black>=24.3",
  "isort>=5.12",
  "mypy>=1.6",
  "types-PyYAML",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ups*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
force_grid_wrap = 0
include_trailing_comma = true

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist", ".venv", "data", "export"]

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP", "B", "N", "A",
]
ignore = [
  "B007",
  "B904",
  "B905",
  "E402",
  "E501",
  "E722",
  "F841",
  "N812",
  "N803",
  "N806",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests/unit", "tests/integration"]
