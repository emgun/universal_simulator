numeric_contract:
  accumulation_dtype: float64
  epsilon: 1.0e-8
  epsilon_placement: task_target_mean_square_before_square_root
  finite_values_required: true
metrics:
  task_primary_nrmse:
    status: unchanged_from_strat-v1
    formula: sqrt(sum((prediction-target)^2)/N_task)/sqrt(sum(target^2)/N_task+epsilon)
    pooling: all_elements_of_one_task_validation_split
  global_scale_regime_nrmse:
    report_key_suffix: global_scale_nrmse
    formula: sqrt(sum_regime((prediction-target)^2)/N_regime)/sqrt(sum_task(target^2)/N_task+epsilon)
    numerator_pooling: all_elements_of_one_declared_regime
    denominator_pooling: all_elements_of_the_same_task_validation_split
    aggregation: element_weighted_root_mean_square
    selection_role: promotion_gate
  regime_error_ratio_to_persistence:
    report_key_suffix: error_ratio_to_persistence
    formula: candidate_global_scale_regime_nrmse/persistence_global_scale_regime_nrmse
    denominator_policy: same_task_same_regime_same_validation_split
    selection_role: reporting_only
  slice_normalized_regime_nrmse:
    report_key_suffix: nrmse
    status: retained_unchanged
    selection_role: diagnostic_only
promotion_gate:
  metric: global_scale_regime_nrmse_to_task_primary_nrmse
  formula: global_scale_regime_nrmse/task_primary_nrmse
  aggregation: maximum_over_declared_regimes_within_each_task
  operator: less_than_or_equal
  maximum: 1.5
  required_scope: every_task
  persistence_ratio_role: reporting_only
freeze_access:
  derivation_split: valid
  allowed_roles:
